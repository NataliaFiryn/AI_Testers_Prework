name: Rolnopol Docker Image Test

on:
  # push:
  #   branches: [main, master]
  # pull_request:
  #   branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    services:
      rolnopol:
        image: jaktestowac/rolnopol:latest
        ports:
          - 3000:3000

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check Rolnopol status
        run: |
          curl --fail --show-error --silent http://localhost:3000/api/v1/about
          curl --fail --show-error --silent http://localhost:3000/api/v1/healthcheck

      - name: Run Playwright tests
        run: npm test -- --project=chromium
