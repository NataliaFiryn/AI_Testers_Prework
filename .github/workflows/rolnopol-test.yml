name: Rolnopol Docker Image Test

on:
  # push:
  #   branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    services:
      rolnopol:
        image: jaktestowac/rolnopol:latest
        ports:
          - 3000:3000

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Wait for Rolnopol service
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/v1/healthcheck > /dev/null; then
              echo "Rolnopol service is ready"
              curl --fail --show-error --silent http://localhost:3000/api/v1/about
              exit 0
            fi

            echo "Waiting for Rolnopol service (attempt ${attempt}/30)..."
            sleep 2
          done

          echo "Rolnopol service did not become ready within 60 seconds" >&2
          exit 1

      - name: Run Playwright tests
        run: npm test -- --project=chromium

      - name: Upload Playwright HTML report
        if: success() || failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14
